name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Node DSP tests
        run: node test/engine.js

  hosted:
    name: Hosted build files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install pillow markdown
      - name: Build the hosted site
        run: python3 build.py --hosted _site
      - name: Check the split build references existing files
        run: python3 test/hosted-files.py _site
