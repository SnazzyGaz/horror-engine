name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Node DSP tests
        run: node test/engine.js
      - name: Check texture path detection
        run: node test/tex-path.js
      - name: Custom Moments
        run: node test/moments.js
      - name: Per-voice Tune & place offsets
        run: node test/offsets.js
      - name: v1.4 files, last minute, audio input, Bowed Cymbal
        run: node test/v14.js

  dom:
    name: UI checks (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Moments UI
        run: node test/moments-dom.js
      - name: Undo, MIDI learn, share links, last minute UI
        run: node test/v14-dom.js

  hosted:
    name: Hosted build files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install pillow markdown
      - name: Build the hosted site
        run: python3 build.py --hosted _site
      - name: Check the split build references existing files
        run: python3 test/hosted-files.py _site
